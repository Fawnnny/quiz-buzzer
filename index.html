<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抢答器 · 选手端</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; display: flex; flex-direction: column; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #94a3b8; }
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 16px; }
  button { padding: 12px 20px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: #3b82f6; color: white; width: 100%; margin-top: 16px; }
  .btn-primary:disabled { background: #475569; cursor: not-allowed; }
  .buzz-btn { width: 100%; padding: 40px; font-size: 32px; font-weight: 800; border-radius: 16px; background: #ef4444; color: white; margin-top: 16px; border: none; }
  .buzz-btn:disabled { background: #475569; }
  .buzz-btn.ready { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .question { font-size: 22px; line-height: 1.5; min-height: 60px; }
  .countdown { font-size: 48px; font-weight: 800; text-align: center; color: #fbbf24; min-height: 56px; }
  .winner { font-size: 24px; font-weight: 800; text-align: center; padding: 20px; border-radius: 12px; background: #065f46; color: #d1fae5; margin-top: 16px; }
  .winner.me { background: #166534; }
  .muted { color: #94a3b8; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div id="joinView">
    <div class="card">
      <h1>加入抢答</h1>
      <label>组号</label>
      <select id="group"></select>
      <label>昵称</label>
      <input id="name" maxlength="20" placeholder="请输入你的昵称">
      <label>邀请码</label>
      <input id="code" placeholder="请输入邀请码">
      <button class="btn-primary" onclick="join()">加入</button>
      <p id="joinError" class="muted" style="color:#f87171"></p>
    </div>
  </div>
  <div id="playView" class="hidden">
    <div class="card">
      <div class="muted" id="meInfo"></div>
      <div class="question" id="question">等待主持人出题…</div>
      <div class="countdown" id="countdown"></div>
      <button class="buzz-btn" id="buzzBtn" onclick="buzz()" disabled>抢答</button>
      <div id="winner" class="winner hidden"></div>
      <p class="muted" id="status"></p>
    </div>
  </div>
</div>
<script>
const groupSelect = document.getElementById('group');
for (let i = 1; i <= 10; i++) {
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = '第 ' + i + ' 组';
  groupSelect.appendChild(opt);
}

let playerId = localStorage.getItem('playerId');
let token = localStorage.getItem('token');
let pollTimer = null;
let countdownTimer = null;

async function join() {
  const group = groupSelect.value;
  const name = document.getElementById('name').value.trim();
  const code = document.getElementById('code').value;
  document.getElementById('joinError').textContent = '';
  try {
    const res = await fetch('/api/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ group, name, code })
    });
    const data = await res.json();
    if (!data.ok) { document.getElementById('joinError').textContent = data.error; return; }
    playerId = data.playerId; token = data.token;
    localStorage.setItem('playerId', playerId);
    localStorage.setItem('token', token);
    showPlay();
  } catch (e) {
    document.getElementById('joinError').textContent = '网络错误';
  }
}

function showPlay() {
  document.getElementById('joinView').classList.add('hidden');
  document.getElementById('playView').classList.remove('hidden');
  poll();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1500);
}

async function poll() {
  if (!playerId || !token) return;
  try {
    const res = await fetch(`/api/state?playerId=${playerId}&token=${token}`);
    const s = await res.json();
    if (!s.ok) return;

    // token 失效（被踢出或清空了选手），回到加入页
    if (!s.me) {
      localStorage.removeItem('playerId');
      localStorage.removeItem('token');
      playerId = null; token = null;
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById('playView').classList.add('hidden');
      document.getElementById('joinView').classList.remove('hidden');
      document.getElementById('joinError').textContent = '你已被移出，请重新加入';
      return;
    }

    document.getElementById('meInfo').textContent = `${s.me.group} 组 · ${s.me.name}`;
    document.getElementById('question').textContent = s.questionText || '等待主持人出题…';

    const buzzBtn = document.getElementById('buzzBtn');
    const winnerEl = document.getElementById('winner');
    const statusEl = document.getElementById('status');

    if (s.phase === 'open') {
      buzzBtn.disabled = false;
      buzzBtn.classList.add('ready');
      statusEl.textContent = '可以抢答！';
      winnerEl.classList.add('hidden');
    } else {
      buzzBtn.disabled = true;
      buzzBtn.classList.remove('ready');
    }

    if (s.phase === 'locked' && s.winner) {
      const isMe = s.winner.group === s.me.group;
      winnerEl.classList.remove('hidden');
      winnerEl.classList.toggle('me', isMe);
      winnerEl.textContent = isMe ? '🎉 你抢到了！' : `第 ${s.winner.group} 组抢到（${s.winner.name}）`;
      statusEl.textContent = '';
    } else if (s.phase === 'timeout') {
      winnerEl.classList.remove('hidden');
      winnerEl.classList.remove('me');
      winnerEl.textContent = '⏰ 时间到，无人抢答';
    } else if (s.phase === 'idle') {
      winnerEl.classList.add('hidden');
      statusEl.textContent = '等待主持人开始…';
    }

    updateCountdown(s.countdownEnd, s.phase);
  } catch (e) {}
}

function updateCountdown(end, phase) {
  clearInterval(countdownTimer);
  const el = document.getElementById('countdown');
  if (!end || phase !== 'open') { el.textContent = ''; return; }
  const tick = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    el.textContent = left + 's';
    if (left <= 0) { el.textContent = '时间到'; clearInterval(countdownTimer); }
  };
  tick();
  countdownTimer = setInterval(tick, 200);
}

async function buzz() {
  if (!playerId) return;
  const btn = document.getElementById('buzzBtn');
  btn.disabled = true;
  btn.classList.remove('ready');
  try {
    const res = await fetch('/api/buzz', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ playerId, token })
    });
    const data = await res.json();
    if (!data.ok) document.getElementById('status').textContent = data.error || '抢答失败';
    poll();
  } catch (e) {}
}

if (playerId && token) showPlay();
</script>
</body>
</html>
